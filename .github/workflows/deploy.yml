name: CI/CD 파이프라인 (eduops-next)

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20.19.0 설정 및 npm 캐시 활성화
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: npm 의존성 검증
        run: npm ci

      - name: .env.production 파일 생성
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env.production

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest

      - name: 원격 서버에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            cd ${{ secrets.REMOTE_PROJECT_PATH }}
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest

            docker stop ${{ secrets.SERVICE_NAME }} || true
            docker rm ${{ secrets.SERVICE_NAME }} || true 

            docker run -d \
              -p 3000:3000 \
              -e TZ=Asia/Seoul \
              --name ${{ secrets.SERVICE_NAME }} \
              --network nginx-proxy_gyubuntu_net \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.SERVICE_NAME }}:latest

            docker image prune -f

      - name: 성공 메세지 출력
        if: success()
        run: echo "🎉 Next.js CI/CD 파이프라인 배포 성공"
